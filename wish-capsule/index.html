
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wish Time Capsule</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #11152c;
      color: #f5efdf;
      font-family: Georgia, serif;
      text-align: center;
    }
    main { padding: 2rem; max-width: 600px; }
    .moon { color: #e5c895; font-size: 4rem; }
    h1 { font-size: clamp(2.5rem, 8vw, 4.5rem); font-weight: normal; }
    em { color: #e5c895; }
    p { color: #c6c5d5; line-height: 1.8; }
  </style>
</head>
<body>
  <main>
    <div class="moon">☾</div>
    <h1>Wish Time <em>Capsule</em></h1>
    <p>Some wishes need time.</p>
    <p>A little message for the future, sealed away for one year.</p>
  </main>
</body>
</html>
