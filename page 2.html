
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Wishes</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fffafb;
      color: #333;
    }

    header {
      text-align: center;
      padding: 70px 20px 35px;
    }

    header h1 {
      font-family: Georgia, serif;
      font-size: 44px;
      font-weight: normal;
      margin-bottom: 15px;
      color: #bd6486;
    }

    header p {
      color: #777;
      line-height: 1.7;
    }

    main {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    .card {
      background: white;
      border: 1px solid #f0e3e8;
      border-radius: 14px;
      padding: 28px;
      margin-bottom: 25px;
    }

    h2 {
      font-size: 21px;
      margin-top: 0;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-size: 14px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #e5d9df;
      border-radius: 8px;
      font: inherit;
    }

    textarea {
      height: 130px;
      resize: vertical;
    }

    input:focus, textarea:focus {
      outline: 2px solid #e8b5ca;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      background: #bd6486;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #a94e72;
    }

    .wish {
      border-top: 1px solid #f0e3e8;
      padding: 18px 0;
      overflow-wrap: anywhere;
    }

    .wish strong {
      color: #bd6486;
    }

    .wish p {
      white-space: pre-wrap;
      line-height: 1.6;
    }

    #status {
      font-size: 14px;
      margin-top: 12px;
    }

    footer {
      text-align: center;
      color: #999;
      font-size: 13px;
      padding: 30px 15px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Birthday Wishes 🎂</h1>
    <p>
      A special day deserves special words.<br>
      Leave a birthday wish and make it memorable. ♡
    </p>
  </header>

  <main>
    <section class="card">
      <h2>Write a birthday wish</h2>

      <form id="wishForm">
        <label for="name">Your name</label>
        <input
          id="name"
          type="text"
          placeholder="Enter your name"
          maxlength="60"
          required
        >

        <label for="message">Your message</label>
        <textarea
          id="message"
          placeholder="Write your birthday message..."
          maxlength="1000"
          required
        ></textarea>

        <button type="submit">Send birthday wish ♡</button>
        <p id="status" role="status"></p>
      </form>
    </section>

    <section class="card">
      <h2>Birthday wishes</h2>
      <div id="wishes">
        <p>Be the first to leave a birthday wish! 💗</p>
      </div>
    </section>
  </main>

  <footer>
    Made with love ♡
  </footer>


        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
    const SUPABASE_URL = "https://rtrxcqoprdihifzeefjn.supabase.co";
    const SUPABASE_KEY = "sb_publishable_ytigq2n1TaK69SpJEcnmHA_NdpiUtuZ";

    const form = document.getElementById("wishForm");
    const wishes = document.getElementById("wishes");
    const status = document.getElementById("status");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const message = document.getElementById("message").value.trim();

      if (!name || !message) return;

      const card = document.createElement("div");
      card.className = "wish";

      const heading = document.createElement("strong");
      heading.textContent = name;

      const text = document.createElement("p");
      text.textContent = message;

      card.append(heading, text);

      if (wishes.querySelector(".wish") === null) {
        wishes.replaceChildren();
      }

      wishes.prepend(card);
      form.reset();
      status.textContent = "Your birthday wish has been added! ♡";
    });
  </script>
</body>
</html>
